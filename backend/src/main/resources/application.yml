spring:
  application:
    name: bike-backend
  profiles:
    default: mock
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bike}
    username: ${DB_USER:bike}
    password: ${DB_PASSWORD:bike_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 3000
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: bike-telemetry-worker
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  flyway:
    connect-retries: 10
  session:
    timeout: 8h
    redis:
      namespace: bike:session

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  kafka:
    telemetry-topic: vehicle-telemetry
  bootstrap-admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:Admin123!}
  report:
    storage-path: ${REPORT_STORAGE_PATH:./build/reports}
  operations:
    evidence-storage-path: ${OPS_EVIDENCE_STORAGE_PATH:./build/ops-evidence}
  amap:
    web-service-key: ${AMAP_WEB_SERVICE_KEY:}
    distance-api-url: ${AMAP_DISTANCE_API_URL:https://restapi.amap.com/v3/distance}
    driving-api-url: ${AMAP_DRIVING_API_URL:https://restapi.amap.com/v3/direction/driving}

logging:
  level:
    root: INFO
    cn.bike.platform: INFO

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
