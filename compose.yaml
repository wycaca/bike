services:
  db:
    image: dockerproxy.net/timescale/timescaledb-ha:pg17.10-ts2.29.1
    environment:
      POSTGRES_DB: bike
      POSTGRES_USER: bike
      POSTGRES_PASSWORD: bike_dev_password
    ports:
      - "5432:5432"
    volumes:
      - bike-db-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bike -d bike"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: m.daocloud.io/docker.io/library/redis:7.4.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - bike-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: m.daocloud.io/docker.io/apache/kafka:4.2.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: mock
      DB_HOST: db
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AMAP_KEY: ${VITE_AMAP_KEY:?VITE_AMAP_KEY is required in .env.local}
        VITE_AMAP_SERVICE_HOST: ${VITE_AMAP_SERVICE_HOST:-/_AMapService}
    environment:
      AMAP_SECURITY_JSCODE: ${AMAP_SECURITY_JSCODE:?AMAP_SECURITY_JSCODE is required in .env.local}
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  bike-db-data:
  bike-redis-data:

