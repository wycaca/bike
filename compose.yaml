services:
  db:
    image: dockerproxy.net/timescale/timescaledb-ha:pg17.10-ts2.29.1
    environment:
      POSTGRES_DB: bike
      POSTGRES_USER: bike
      POSTGRES_PASSWORD: bike_dev_password
    ports:
      - "5432:5432"
    volumes:
      - bike-db-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bike -d bike"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: m.daocloud.io/docker.io/library/redis:7.4.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - bike-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: m.daocloud.io/docker.io/apache/kafka:4.2.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  backend:
    image: bike-backend:local
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: mock
      DB_HOST: db
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-Admin123!}
      REPORT_STORAGE_PATH: /data/reports
      OPS_EVIDENCE_STORAGE_PATH: /data/ops-evidence
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - bike-report-data:/data/reports:ro
      - bike-ops-evidence-data:/data/ops-evidence
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  report-worker:
    image: bike-backend:local
    environment:
      SPRING_PROFILES_ACTIVE: report-worker
      SPRING_FLYWAY_ENABLED: "false"
      DB_HOST: db
      DB_POOL_SIZE: 1
      DB_MIN_IDLE: 0
      REPORT_DB_URL: ${REPORT_DB_URL:-}
      REPORT_DB_HOST: ${REPORT_DB_HOST:-db}
      REPORT_DB_PORT: ${REPORT_DB_PORT:-5432}
      REPORT_DB_NAME: ${REPORT_DB_NAME:-bike}
      REPORT_DB_USER: ${REPORT_DB_USER:-bike}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD:-bike_dev_password}
      REPORT_DB_POOL_SIZE: 1
      REPORT_STATEMENT_TIMEOUT_MS: 120000
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REPORT_STORAGE_PATH: /data/reports
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - bike-report-data:/data/reports
    cpus: 1.0
    mem_limit: 512m
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AMAP_KEY: ${VITE_AMAP_KEY:?VITE_AMAP_KEY is required in .env.local}
        VITE_AMAP_SERVICE_HOST: ${VITE_AMAP_SERVICE_HOST:-/_AMapService}
    environment:
      AMAP_SECURITY_JSCODE: ${AMAP_SECURITY_JSCODE:?AMAP_SECURITY_JSCODE is required in .env.local}
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

  mobile-web:
    image: bike-mobile-web:local
    build:
      context: ./app
    ports:
      - "18082:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  bike-db-data:
  bike-redis-data:
  bike-report-data:
  bike-ops-evidence-data:

